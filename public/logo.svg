<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 180" width="100%" height="100%" fill="none">
  <!-- HAK fix Official Logo - Apple Sapphire Blue Edition -->
  <defs>
    <linearGradient id="fixGrad3D" x1="360" y1="38" x2="560" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#2997FF" />
      <stop offset="60%" stopColor="#0071E3" />
      <stop offset="100%" stopColor="#0058B6" />
    </linearGradient>
    <linearGradient id="hakGrad3D" x1="20" y1="38" x2="350" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#1E293B" />
      <stop offset="100%" stopColor="#0C2340" />
    </linearGradient>
  </defs>

  <g id="HAK">
    <!-- H -->
    <rect x="20" y="38" width="26" height="122" rx="4" fill="url(#hakGrad3D)"/>
    <rect x="84" y="38" width="26" height="122" rx="4" fill="url(#hakGrad3D)"/>
    <rect x="46" y="86" width="38" height="26" fill="url(#hakGrad3D)"/>

    <!-- A (House shape) -->
    <path d="M 136 160 
             L 136 78 
             L 178 36 
             L 220 78 
             L 220 160 
             L 194 160 
             L 194 98 
             L 178 82 
             L 162 98 
             L 162 160 
             Z" 
          fill="url(#hakGrad3D)" 
          stroke="#0C2340" 
          stroke-width="1.5" 
          stroke-linejoin="round"/>
    
    <!-- 4 Sapphire Window Panes in House -->
    <rect x="167" y="112" width="9" height="9" rx="1.5" fill="#0071E3"/>
    <rect x="180" y="112" width="9" height="9" rx="1.5" fill="#0071E3"/>
    <rect x="167" y="125" width="9" height="9" rx="1.5" fill="#0071E3"/>
    <rect x="180" y="125" width="9" height="9" rx="1.5" fill="#0071E3"/>

    <!-- K -->
    <rect x="238" y="38" width="26" height="122" rx="4" fill="url(#hakGrad3D)"/>
    <polygon points="264,112 308,38 338,38 284,124" fill="url(#hakGrad3D)"/>
    <polygon points="274,104 314,160 344,160 292,94" fill="url(#hakGrad3D)"/>
  </g>

  <!-- fix -->
  <g id="fix" fill="url(#fixGrad3D)">
    <!-- f -->
    <path d="M 374 38 
             C 362 38 354 46 354 58 
             L 354 160 
             L 378 160 
             L 378 94 
             L 396 94 
             L 396 74 
             L 378 74 
             L 378 58 
             C 378 54 380 52 384 52 
             L 394 52 
             L 394 38 
             Z" 
          fill="url(#fixGrad3D)"/>
    <rect x="344" y="74" width="20" height="20" rx="3" fill="url(#fixGrad3D)"/>

    <!-- i -->
    <circle cx="418" cy="48" r="11" fill="url(#fixGrad3D)"/>
    <rect x="406" y="74" width="24" height="86" rx="4" fill="url(#fixGrad3D)"/>

    <!-- x with open wrench head on top right -->
    <polygon points="440,74 462,74 520,160 498,160" fill="url(#fixGrad3D)"/>
    <polygon points="468,114 442,154 442,160 464,160 484,130" fill="url(#fixGrad3D)"/>
    
    <polygon points="486,112 506,90 518,102 498,124" fill="url(#fixGrad3D)"/>
    <path d="M 505 78
             C 502 68 506 56 516 48
             C 527 39 542 41 550 51
             C 554 56 555 63 553 69
             L 540 60
             C 536 57 530 58 526 62
             C 522 66 523 72 527 76
             L 538 88
             C 532 90 525 89 519 86
             Z" 
          fill="url(#fixGrad3D)"/>
  </g>
</svg>
